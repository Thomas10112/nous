name: APK de la maquette Android

# Construit l'APK du spike React Native (spike/week-grid) et le publie en
# pré-version, pour qu'il soit installable sur le S24 Ultra sans PC ni compte.
# Le dépôt étant public, les minutes GitHub sont gratuites et illimitées.
#
# Ce n'est PAS l'application : c'est la maquette de la vue Semaine, jetable,
# qui sert à mesurer les gestes et la fluidité avant d'écrire le vrai code.

on:
  push:
    branches: [claude/nous-calendar-architecture-dnuyje]
    paths:
      - 'spike/week-grid/**'
      - '.github/workflows/spike-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spike/week-grid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Générer le projet natif
        run: npx expo prebuild --platform android --no-install

      # Une seule architecture (arm64-v8a) : c'est celle du S24 Ultra, et cela
      # divise par deux le temps de compilation C++ et la taille du fichier.
      - name: Compiler l'APK
        working-directory: spike/week-grid/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Renommer et mesurer
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC" || { echo "aucun APK produit"; exit 1; }
          mkdir -p out
          cp "$SRC" "out/nous-maquette-semaine.apk"
          SIZE=$(du -h out/nous-maquette-semaine.apk | cut -f1)
          echo "taille=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK : $SIZE"

      - uses: actions/upload-artifact@v4
        with:
          name: nous-maquette-semaine-apk
          path: spike/week-grid/out/nous-maquette-semaine.apk
          retention-days: 14

      - name: Publier la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="maquette-android-${{ github.run_number }}"
          gh release create "$TAG" \
            out/nous-maquette-semaine.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Maquette Semaine pour Android (${{ steps.apk.outputs.taille }})" \
            --prerelease \
            --notes "Maquette jetable de la vue Semaine, à installer sur le Galaxy S24 Ultra pour juger les gestes et la fluidité. Ce n'est pas l'application.

**Avant d'installer**, dans Réglages → Sécurité et confidentialité, vérifier qu'**Auto Blocker** et **Advanced Protection** sont éteints : sinon aucune installation n'est possible, et le réglage « installer des applications inconnues » est grisé.

**Installer** : télécharger le fichier depuis le téléphone, ouvrir, autoriser Chrome à installer des applications inconnues, puis « Installer quand même » sur l'avertissement Play Protect.

**Ce qu'on mesure** : le compteur en haut à droite affiche la fréquence de l'écran et le budget par image (8,3 ms à 120 Hz). Appui long puis glissé, poignées, pincement, balayage horizontal pour changer de semaine, appui sur un jour pour élargir sa colonne. Détail dans \`spike/week-grid/README.md\`.

L'équivalent web, pour l'iPhone comme pour l'Android, se teste sans rien installer."
